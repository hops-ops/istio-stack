apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: istiostacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: IstioStack
    plural: istiostacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: IstioStack installs Istio in ambient dataplane mode (istio/base + istiod + ztunnel) plus an optional platform Gateway resource. Sidecar mode is not supported. Gateway API CRDs (gateway.networking.k8s.io) are a hard prerequisite — install via gateway-api-stack.
        type: object
        properties:
          spec:
            description: IstioStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for provider config refs.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Helm ProviderConfig reference. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Kubernetes ProviderConfig reference. Used for the Gateway resource and namespaces. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              namespace:
                description: Namespace for the Istio control plane (base, istiod, ztunnel). Defaults to "istio-system".
                type: string
              chartVersion:
                description: Helm chart version applied to base, istiod, and ztunnel. Defaults to "1.29.2".
                type: string
              base:
                description: istio/base chart configuration.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              istiod:
                description: istio/istiod chart configuration. The composition forces profile=ambient — overriding it via overrideAllValues is unsupported.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              cni:
                description: istio/cni chart configuration. The CNI node agent is a hard prereq for ambient mode — it configures pod network namespaces for L4/L7 interception and exposes the socket ztunnel binds to.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              ztunnel:
                description: istio/ztunnel chart configuration. ztunnel is the per-node L4 mTLS DaemonSet that ambient mode uses instead of per-pod sidecars.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              ingressGateway:
                description: Platform Gateway API ingress configuration. When enabled, composes a Gateway resource that consumer routes (Knative HTTPRoutes, manual HTTPRoutes) attach to via parentRefs.
                type: object
                properties:
                  enabled:
                    description: Whether to compose the Gateway resource. Defaults to true.
                    type: boolean
                    default: true
                  name:
                    description: metadata.name of the Gateway. Defaults to "platform".
                    type: string
                  namespace:
                    description: Namespace for the Gateway resource. Defaults to "istio-ingress". The composition creates this namespace.
                    type: string
                  gatewayClassName:
                    description: Gateway API GatewayClass name. Defaults to "istio" (the ambient class registered by istiod).
                    type: string
                  listeners:
                    description: Gateway listener configurations. Each entry maps directly to a gateway.networking.k8s.io/v1 Gateway listener. Hostnames may include wildcards. TLS certificateRefs are typically populated dynamically by Knative auto-TLS or manual issuance.
                    type: array
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
              extensionProviders:
                description: |
                  Istio MeshConfig extensionProviders registered on istiod. Each entry maps 1:1
                  onto a meshConfig.extensionProviders[] element so AuthorizationPolicy.CUSTOM
                  rules in any namespace can reference the registered provider name. Operator-
                  managed list — consumer stacks (oauth2-proxy bridges, etc.) declare intent in
                  their own spec, and the operator adds the matching entry here. Currently
                  scoped to envoyExtAuthzHttp and envoyExtAuthzGrpc; broader MeshConfig knobs
                  are out of scope for this surface. Exactly one of envoyExtAuthzHttp /
                  envoyExtAuthzGrpc must be set per entry; render fails otherwise.
                type: array
                items:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      description: Unique provider name. AuthorizationPolicy.CUSTOM rules reference this string. Convention is <stack-namespace>-oauth2-proxy (e.g., observe-oauth2-proxy).
                      type: string
                    envoyExtAuthzHttp:
                      description: HTTP ext_authz provider. Mirrors Istio MeshConfig.ExtensionProvider.EnvoyExternalAuthorizationHttpProvider.
                      type: object
                      required:
                      - service
                      - port
                      properties:
                        service:
                          description: FQDN of the ext_authz service (e.g., oauth2-proxy.observe.svc.cluster.local).
                          type: string
                        port:
                          description: Port of the ext_authz service.
                          type: integer
                        pathPrefix:
                          description: Path prefix for the ext_authz HTTP check (e.g., /oauth2/auth).
                          type: string
                        timeout:
                          description: ext_authz call timeout as a duration string (e.g., 1s, 250ms).
                          type: string
                        includeRequestHeadersInCheck:
                          description: Request headers to forward to the ext_authz service.
                          type: array
                          items:
                            type: string
                        headersToUpstreamOnAllow:
                          description: Response headers from the ext_authz service to forward upstream when the request is allowed.
                          type: array
                          items:
                            type: string
                        headersToDownstreamOnAllow:
                          description: Response headers from the ext_authz service to forward downstream when the request is allowed.
                          type: array
                          items:
                            type: string
                        headersToDownstreamOnDeny:
                          description: Response headers from the ext_authz service to forward downstream when the request is denied.
                          type: array
                          items:
                            type: string
                        statusOnError:
                          description: HTTP status code returned to the downstream client when the ext_authz call fails (default 403).
                          type: string
                    envoyExtAuthzGrpc:
                      description: gRPC ext_authz provider. Mirrors Istio MeshConfig.ExtensionProvider.EnvoyExternalAuthorizationGrpcProvider.
                      type: object
                      required:
                      - service
                      - port
                      properties:
                        service:
                          description: FQDN of the ext_authz gRPC service.
                          type: string
                        port:
                          description: Port of the ext_authz gRPC service.
                          type: integer
                        timeout:
                          description: ext_authz call timeout.
                          type: string
                        failOpen:
                          description: When true, allow requests if the ext_authz service is unreachable. Defaults to false (deny on error), matching Istio.
                          type: boolean
              awsLoadBalancerController:
                description: AWS Load Balancer Controller integration. This stack does NOT install the controller — install separately via aws-lbc-stack. When enabled, NLB annotations are propagated to the Gateway's auto-created Service via spec.infrastructure.annotations on the Gateway resource. The LBC then provisions an NLB in TCP passthrough mode.
                type: object
                properties:
                  enabled:
                    description: Render LBC annotations on the Gateway's infrastructure.annotations. Defaults to false.
                    type: boolean
                    default: false
                  scheme:
                    description: NLB scheme.
                    type: string
                    enum:
                    - internet-facing
                    - internal
                    default: internet-facing
                  targetType:
                    description: NLB target type.
                    type: string
                    enum:
                    - ip
                    - instance
                    default: ip
                  crossZoneEnabled:
                    description: Enable NLB cross-zone load balancing.
                    type: boolean
                    default: true
                  additionalAnnotations:
                    description: Extra annotations merged into the Gateway's infrastructure.annotations.
                    type: object
                    additionalProperties:
                      type: string
                  releaseRef:
                    description: aws-lbc-stack helm Release reference. When set, emits a Usage so the LBC Release cannot be deleted while the Gateway exists.
                    type: object
                    properties:
                      name:
                        type: string
            required:
            - clusterName
          status:
            description: IstioStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness — base + istiod + ztunnel + (if enabled) gateway.
                type: boolean
              base:
                type: object
                properties:
                  ready:
                    type: boolean
              istiod:
                type: object
                properties:
                  ready:
                    type: boolean
              cni:
                type: object
                properties:
                  ready:
                    type: boolean
              ztunnel:
                type: object
                properties:
                  ready:
                    type: boolean
              gateway:
                type: object
                properties:
                  ready:
                    type: boolean
              extensionProviders:
                description: Observed state of the registered MeshConfig extensionProviders. Consumers gate AuthorizationPolicy.CUSTOM MRs on this readiness to avoid race-on-first-apply.
                type: object
                properties:
                  configured:
                    description: Names of extensionProviders that made it into the rendered istiod helm values.
                    type: array
                    items:
                      type: string
                  ready:
                    description: True when istiod is Ready and the rendered providers match the spec list.
                    type: boolean
        required:
        - spec
