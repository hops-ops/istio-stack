apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: istiostacks.hops.ops.com.ai
spec:
  group: hops.ops.com.ai
  names:
    kind: IstioStack
    plural: istiostacks
  scope: Namespaced
  versions:
  - name: v1alpha1
    referenceable: true
    served: true
    schema:
      openAPIV3Schema:
        description: IstioStack installs Istio in ambient dataplane mode (istio/base + istiod + ztunnel) plus an optional platform Gateway resource. Sidecar mode is not supported. Gateway API CRDs (gateway.networking.k8s.io) are a hard prerequisite — install via gateway-api-stack.
        type: object
        properties:
          spec:
            description: IstioStackSpec defines the desired state.
            type: object
            properties:
              clusterName:
                description: Name of the target cluster. Used as default for provider config refs.
                type: string
              managementPolicies:
                description: Management policies for all composed resources. Defaults to ["*"].
                type: array
                items:
                  type: string
                default:
                - "*"
              labels:
                description: Custom labels applied to all managed resources.
                type: object
                additionalProperties:
                  type: string
                x-kubernetes-preserve-unknown-fields: true
              helmProviderConfigRef:
                description: Helm ProviderConfig reference. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              kubernetesProviderConfigRef:
                description: Kubernetes ProviderConfig reference. Used for the Gateway resource and namespaces. Defaults to clusterName.
                type: object
                properties:
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
              namespace:
                description: Namespace for the Istio control plane (base, istiod, ztunnel). Defaults to "istio-system".
                type: string
              chartVersion:
                description: Helm chart version applied to base, istiod, and ztunnel. Defaults to "1.29.2".
                type: string
              base:
                description: istio/base chart configuration.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              istiod:
                description: istio/istiod chart configuration. The composition forces profile=ambient — overriding it via overrideAllValues is unsupported.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              cni:
                description: istio/cni chart configuration. The CNI node agent is a hard prereq for ambient mode — it configures pod network namespaces for L4/L7 interception and exposes the socket ztunnel binds to.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              ztunnel:
                description: istio/ztunnel chart configuration. ztunnel is the per-node L4 mTLS DaemonSet that ambient mode uses instead of per-pod sidecars.
                type: object
                properties:
                  values:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  overrideAllValues:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
              ingressGateway:
                description: Platform Gateway API ingress configuration. When enabled, composes a Gateway resource that consumer routes (Knative HTTPRoutes, manual HTTPRoutes) attach to via parentRefs.
                type: object
                properties:
                  enabled:
                    description: Whether to compose the Gateway resource. Defaults to true.
                    type: boolean
                    default: true
                  name:
                    description: metadata.name of the Gateway. Defaults to "platform".
                    type: string
                  namespace:
                    description: Namespace for the Gateway resource. Defaults to "istio-ingress". The composition creates this namespace.
                    type: string
                  gatewayClassName:
                    description: Gateway API GatewayClass name. Defaults to "istio" (the ambient class registered by istiod).
                    type: string
                  listeners:
                    description: Gateway listener configurations. Each entry maps directly to a gateway.networking.k8s.io/v1 Gateway listener. Hostnames may include wildcards. TLS certificateRefs are typically populated dynamically by Knative auto-TLS or manual issuance.
                    type: array
                    items:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
              awsLoadBalancerController:
                description: AWS Load Balancer Controller integration. This stack does NOT install the controller — install separately via aws-lbc-stack. When enabled, NLB annotations are propagated to the Gateway's auto-created Service via spec.infrastructure.annotations on the Gateway resource. The LBC then provisions an NLB in TCP passthrough mode.
                type: object
                properties:
                  enabled:
                    description: Render LBC annotations on the Gateway's infrastructure.annotations. Defaults to false.
                    type: boolean
                    default: false
                  scheme:
                    description: NLB scheme.
                    type: string
                    enum:
                    - internet-facing
                    - internal
                    default: internet-facing
                  targetType:
                    description: NLB target type.
                    type: string
                    enum:
                    - ip
                    - instance
                    default: ip
                  crossZoneEnabled:
                    description: Enable NLB cross-zone load balancing.
                    type: boolean
                    default: true
                  additionalAnnotations:
                    description: Extra annotations merged into the Gateway's infrastructure.annotations.
                    type: object
                    additionalProperties:
                      type: string
                  releaseRef:
                    description: aws-lbc-stack helm Release reference. When set, emits a Usage so the LBC Release cannot be deleted while the Gateway exists.
                    type: object
                    properties:
                      name:
                        type: string
            required:
            - clusterName
          status:
            description: IstioStackStatus defines the observed state.
            type: object
            properties:
              ready:
                description: Overall readiness — base + istiod + ztunnel + (if enabled) gateway.
                type: boolean
              base:
                type: object
                properties:
                  ready:
                    type: boolean
              istiod:
                type: object
                properties:
                  ready:
                    type: boolean
              cni:
                type: object
                properties:
                  ready:
                    type: boolean
              ztunnel:
                type: object
                properties:
                  ready:
                    type: boolean
              gateway:
                type: object
                properties:
                  ready:
                    type: boolean
        required:
        - spec
